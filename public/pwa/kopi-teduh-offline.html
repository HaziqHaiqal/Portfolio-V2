<!doctype html>
<!--
  PWA kit offline page: plain HTML so it works at any address with no app code.
  For a client site, copy it, then change the name, colours and text.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E4F" />
    <title>Offline · Kopi Teduh</title>
    <style>
      :root {
        --brand: #0f6e4f;
        --bg: #f1f6f2;
        --ink: #10231b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: var(--brand);
      }
      h1 {
        margin: 24px 0 0;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 18rem;
        margin: 12px 0 0;
        font-size: 14px;
        line-height: 1.6;
        opacity: 0.7;
      }
      button {
        margin-top: 32px;
        height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        font-family: inherit;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <span class="mark" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 2v2" />
        <path d="M14 2v2" />
        <path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1" />
        <path d="M6 2v2" />
      </svg>
    </span>
    <h1>You're offline</h1>
    <p>Pages you've opened before still work. Reconnect to see the latest menu and send your order.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
